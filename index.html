<style>
/* VOICE: дружелюбный школьный тренажёр, коротко и по делу
   IDEA: тетрадь в клетку — поля с красной линией, синие чернила, пометки учителя
   PICTURE: само упражнение — большая «страница» с кодом и ответами
   COLOUR and TYPE: бумага + синие чернила, красный — поля и ошибки, зелёный — «верно»; Golos Text + JetBrains Mono
   LAYOUT: шапка → вкладки тренажёров → одна страница упражнения; ниже 600px всё в столбик */
:root{color-scheme:light dark;
--bg:light-dark(#f7f8fc,#0e1322);--paper:light-dark(#ffffff,#141a2e);--grid:light-dark(rgba(35,64,200,.09),rgba(140,160,255,.07));
--ink:light-dark(#1a2140,#e7eaf6);--muted:light-dark(#5b6385,#9aa3c4);--blue:light-dark(#2340c8,#93a6ff);--blue-soft:light-dark(#e8ecff,#1e2850);
--red:light-dark(#d93a3f,#ff7378);--red-soft:light-dark(#fdeaea,#3a1a22);--green:light-dark(#178a4c,#5ad796);--green-soft:light-dark(#e4f6ec,#123326);
--line:light-dark(#d9ddee,#2a3352);--code:light-dark(#f2f4fb,#0b1020)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif;overflow-x:clip}
pre,.scroll{overflow-x:auto}code,pre,textarea,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{padding:28px max(5vw,16px) 8px;max-width:1240px;margin:auto}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0 0 6px;font-weight:800;text-wrap:balance}
h1 span{color:var(--blue)}
.sub{color:var(--muted);margin:0}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .scroll{display:flex;gap:6px;padding:10px max(5vw,16px);max-width:1240px;margin:auto}
nav a{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;border:1.5px solid transparent}
nav a:hover{background:var(--blue-soft)}
nav a[aria-current=true]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
nav a small{font:600 12px "JetBrains Mono",monospace;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 6px}
nav a.full small{color:var(--green);border-color:var(--green)}
main{max-width:1240px;margin:auto;padding:22px max(5vw,16px) 60px}
.page{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px clamp(18px,4vw,44px) 30px clamp(30px,6vw,78px);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;box-shadow:0 1px 0 var(--line),0 14px 40px -24px rgba(20,30,80,.35)}
.page::before{content:"";position:absolute;top:0;bottom:0;left:clamp(16px,4.2vw,56px);width:2px;background:var(--red);opacity:.55}
.page h2{font-size:26px;line-height:1.15;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.task{font-size:18px;font-weight:600;margin:0 0 14px;max-width:62ch}
.tag{display:inline-block;font:600 12px "JetBrains Mono",monospace;padding:2px 8px;border-radius:7px;background:var(--blue-soft);color:var(--blue);margin-right:6px;vertical-align:2px}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px;font-size:15px;line-height:1.6;white-space:pre}
.kw{color:var(--blue);font-weight:600}.str{color:var(--green)}.num{color:var(--red)}.cm{color:var(--muted)}
button,.btn{font:600 15px "Golos Text",sans-serif;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--paper)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pager{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-inline-end:auto}
.dot{width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;font:600 11px "JetBrains Mono",monospace;display:grid;place-items:center}
.dot.on{border-color:var(--blue);color:var(--blue)}.dot.ok{background:var(--green);border-color:var(--green);color:var(--paper)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;display:none}
.fb.show{display:block}.fb.ok{background:var(--green-soft);color:var(--green)}.fb.bad{background:var(--red-soft);color:var(--red)}
.fb p{margin:4px 0 0;color:var(--ink)}
/* карточки */
.deck{perspective:1200px;max-width:640px}
.card{position:relative;height:260px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center;gap:10px}
.face.back{transform:rotateY(180deg);background:var(--blue-soft);border-color:var(--blue)}
.face .big{font:600 clamp(18px,3.4vw,24px)/1.35 "JetBrains Mono",monospace;overflow-wrap:anywhere}
.face .lbl{font-size:13px;color:var(--muted)}
.face .mean{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
/* сборка */
.slot{min-height:120px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;background:color-mix(in srgb,var(--paper) 70%,transparent)}
.slot:empty::before{content:"Нажимайте на части запроса по порядку — они появятся здесь";color:var(--muted);font-size:14px;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font:600 14px "JetBrains Mono",monospace;text-align:left;min-height:42px;padding:6px 14px;border-radius:10px;background:var(--code);white-space:normal}
.slot .chip{background:var(--blue-soft);border-color:var(--blue)}
.slot .chip.wrong{background:var(--red-soft);border-color:var(--red)}
/* пропуск */
.blank-code input{font:600 15px "JetBrains Mono",monospace;width:11ch;min-height:34px;padding:2px 8px;border-radius:8px;border:2px solid var(--blue);background:var(--paper);color:var(--blue);text-align:center}
.blank-code input.ok{border-color:var(--green);color:var(--green)}.blank-code input.bad{border-color:var(--red);color:var(--red)}
/* тест */
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 16px;font:500 14.5px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.opt.ok{background:var(--green-soft);border-color:var(--green)}.opt.bad{background:var(--red-soft);border-color:var(--red)}
/* песочница */
.sb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:22px}
textarea{width:100%;min-height:150px;resize:vertical;font-size:15px;line-height:1.6;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--code);color:var(--ink)}
.schema{font-size:13.5px;color:var(--muted);margin:10px 0}
.schema code{color:var(--ink);background:var(--code);padding:1px 5px;border-radius:5px}
.res{margin-top:12px;max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--blue-soft);font-family:"JetBrains Mono",monospace;font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--red);font:500 14px "JetBrains Mono",monospace;padding:12px}
.tasks{display:flex;flex-direction:column;gap:8px}
.tasks button{text-align:left;font-weight:500;padding:10px 14px;height:auto;line-height:1.4}
.tasks button.on{border-color:var(--blue);background:var(--blue-soft)}
.tasks button.ok::before{content:"✓ ";color:var(--green);font-weight:800}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:13px;margin-top:18px}
.foot button{min-height:36px;font-size:13px}
@media(max-width:860px){.sb{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.page{padding:20px 16px 24px 30px}.page::before{left:16px}.card{height:230px}pre.code{font-size:13.5px}}
</style>
</head>

  {t:"Топ-3 оплаченных заказа по сумме: order_id и total (= price * qty); при равной сумме — по order_id.", q:"SELECT order_id, price * qty AS total FROM orders WHERE status = 'оплачен' ORDER BY total DESC, order_id LIMIT 3"},
  {t:"Какие категории покупали в Павлодаре? Только category, без повторов, по алфавиту.", q:"SELECT DISTINCT category FROM orders WHERE city = 'Павлодар' ORDER BY category"},
  {t:"Заказы Xiaomi из Алматы, где qty ≥ 2: order_id, product, qty, по order_id.", q:"SELECT order_id, product, qty FROM orders WHERE product LIKE '%Xiaomi%' AND city = 'Алматы' AND qty >= 2 ORDER BY order_id"},
  {t:"5 последних заказов: order_id, date. Сортировка: date по убыванию, затем order_id по убыванию.", q:"SELECT order_id, date FROM orders ORDER BY date DESC, order_id DESC LIMIT 5"},
];

const SECTIONS = [
  {id:"cards", name:"Карточки", total:CARDS.length},
  {id:"build", name:"Собери запрос", total:BUILD.length},
  {id:"blank", name:"Вставь слово", total:BLANK.length},
  {id:"translate", name:"Переводчик", total:TRANS.length},
  {id:"bugs", name:"Найди ошибку", total:BUGS.length},
  {id:"sandbox", name:"Песочница", total:SANDBOX.length},
];

/* ---------- состояние ---------- */
const KEY = "sql17-workbook";
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
SECTIONS.forEach(s => { if (!Array.isArray(done[s.id])) done[s.id] = []; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const mark = (sec, i) => { if (!done[sec].includes(i)) { done[sec].push(i); save(); renderTabs(); } };
const pos = {build:0, blank:0, translate:0, bugs:0, sandbox:0};
let cardFront = "sql", deck = null, flipped = false;

/* ---------- утилиты ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const KW = /\b(SELECT|DISTINCT|FROM|WHERE|AND|OR|NOT|IN|BETWEEN|LIKE|IS|NULL|ORDER|BY|ASC|DESC|LIMIT|OFFSET|AS|TOP)\b/g;
function hl(code, lang) {
  return code.split(/('[^']*')/).map((part, i) => {
    if (i % 2) return `<span class="str">${esc(part)}</span>`;
    let h = esc(part).replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
    if (lang !== "py") h = h.replace(KW, '<span class="kw">$1</span>');
    return h;
  }).join("");
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const view = document.getElementById("view");
const $ = sel => view.querySelector(sel);

function pager(sec, list) {
  const n = list.length, cur = pos[sec];
  const dots = list.map((_, i) => `<button type="button" class="dot${i === cur ? " on" : ""}${done[sec].includes(i) ? " ok" : ""}" data-go="${i}" aria-label="Задание ${i + 1}">${i + 1}</button>`).join("");
  return `<div class="pager"><div class="dots">${dots}</div>
    <button type="button" data-step="-1" ${cur === 0 ? "disabled" : ""}>← Назад</button>
    <button type="button" class="primary" data-step="1" ${cur === n - 1 ? "disabled" : ""}>Дальше →</button></div>`;
}
function bindPager(sec, render) {
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { pos[sec] = +b.dataset.go; render(); });
  view.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { pos[sec] += +b.dataset.step; render(); });
}
function feedback(ok, title, text) {
  const fb = $(".fb"); fb.className = "fb show " + (ok ? "ok" : "bad");
  fb.innerHTML = `<strong>${esc(title)}</strong>${text ? `<p>${esc(text)}</p>` : ""}`;
}

/* ---------- 1. карточки ---------- */
function newDeck() { deck = shuffle(CARDS.map((_, i) => i).filter(i => !done.cards.includes(i))); flipped = false; }
function renderCards() {
  if (!deck) newDeck();
  const head = `<h2>Карточки SQL ↔ pandas</h2>
    <p class="lead">Посмотрите на карточку, вспомните перевод и нажмите на неё, чтобы проверить. «Знаю» убирает карточку из колоды, «Повторить» отправляет её в конец.</p>
    <div class="row" style="margin-bottom:16px"><span>Сначала показывать:</span>
      <button type="button" data-front="sql" class="${cardFront === "sql" ? "primary" : ""}">SQL</button>
      <button type="button" data-front="py" class="${cardFront === "py" ? "primary" : ""}">pandas</button></div>`;
  if (!deck.length) {
    view.innerHTML = head + `<div class="fb show ok"><strong>Колода пройдена: ${done.cards.length} из ${CARDS.length} 🎉</strong><p>Перемешайте и пройдите ещё раз — повторение и есть запоминание.</p></div>
      <div class="pager"><button type="button" class="primary" id="again">Перемешать всё заново</button></div>`;
    $("#again").onclick = () => { done.cards = []; save(); renderTabs(); newDeck(); renderCards(); };
  } else {
    const [s, p, m] = CARDS[deck[0]];
    const front = cardFront === "sql" ? ["SQL", s, "sql"] : ["pandas", p, "py"];
    const back = cardFront === "sql" ? ["pandas", p, "py"] : ["SQL", s, "sql"];
    view.innerHTML = head + `<div class="deck"><div class="card${flipped ? " flip" : ""}" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку">
        <div class="face"><span class="lbl">${front[0]}</span><div class="big">${hl(front[1], front[2])}</div><span class="lbl">нажмите, чтобы перевернуть</span></div>
        <div class="face back"><span class="lbl">${back[0]}</span><div class="big">${hl(back[1], back[2])}</div><span class="mean">${esc(m)}</span></div>
      </div></div>
      <div class="pager"><span class="dots">Осталось в колоде: ${deck.length}</span>
        <button type="button" id="again">↺ Повторить</button><button type="button" class="primary" id="know">✓ Знаю</button></div>`;
    const card = $("#card");
    const flip = () => { flipped = !flipped; card.classList.toggle("flip", flipped); };
    card.onclick = flip;
    card.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
    $("#know").onclick = () => { mark("cards", deck.shift()); flipped = false; renderCards(); };
    $("#again").onclick = () => { deck.push(deck.shift()); flipped = false; renderCards(); };
  }
  view.querySelectorAll("[data-front]").forEach(b => b.onclick = () => { cardFront = b.dataset.front; flipped = false; renderCards(); });
}

/* ---------- 2. собери запрос ---------- */
let buildState = null;
function renderBuild() {
  const i = pos.build, t = BUILD[i];
  if (!buildState || buildState.i !== i) buildState = {i, pool: shuffle([...t.parts, ...t.extra]), ans: []};
  const st = buildState;
  view.innerHTML = `<h2>Собери запрос</h2>
    <p class="lead">Нажимайте на части запроса в правильном порядке. Одна часть лишняя — с ошибкой. Нажатие на часть в ответе вернёт её обратно.</p>
    <p class="task"><span class="tag">${i + 1}/${BUILD.length}</span>${esc(t.t)}</p>
    <div class="slot" id="slot">${st.ans.map((c, k) => `<button type="button" class="chip" data-back="${k}">${hl(c, "sql")}</button>`).join("")}</div>
    <div class="pool">${st.pool.map((c, k) => `<button type="button" class="chip" data-take="${k}">${hl(c, "sql")}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button type="button" class="primary" id="check">Проверить</button><button type="button" id="clear">Сбросить</button><button type="button" id="show">Показать ответ</button></div>
    <div class="fb"></div>` + pager("build", BUILD);
  view.querySelectorAll("[data-take]").forEach(b => b.onclick = () => { st.ans.push(st.pool.splice(+b.dataset.take, 1)[0]); renderBuild(); });
  view.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { st.pool.push(st.ans.splice(+b.dataset.back, 1)[0]); renderBuild(); });
  $("#clear").onclick = () => { buildState = null; renderBuild(); };
  $("#show").onclick = () => feedback(true, "Правильный порядок:", t.parts.join("  ·  "));
  $("#check").onclick = () => {
    if (st.ans.join("\n") === t.parts.join("\n")) { mark("build", i); feedback(true, "Верно! Запрос собран ✓", t.parts.join(" ")); return; }
    const chips = view.querySelectorAll("#slot .chip");
    const bad = st.ans.findIndex((c, k) => c !== t.parts[k]);
    if (bad >= 0) chips[bad].classList.add("wrong");
    if (st.ans.some(c => t.extra.includes(c))) feedback(false, "В ответе есть часть с ошибкой", "Найдите её и верните обратно.");
    else if (st.ans.length < t.parts.length && bad < 0) feedback(false, "Пока всё верно, но запрос не закончен", "");
    else feedback(false, "Порядок неверный", "Вспомните: SELECT → FROM → WHERE → ORDER BY → LIMIT → OFFSET.");
  };
  bindPager("build", () => { buildState = null; renderBuild(); });
}

/* ---------- 3. вставь слово ---------- */
function renderBlank() {
  const i = pos.blank, t = BLANK[i], lang = t.py ? "py" : "sql";
  const [a, b] = t.code.split("___");
  view.innerHTML = `<h2>Вставь пропущенное слово</h2>
    <p class="lead">Впишите ключевое слово SQL или метод pandas и нажмите Enter.</p>
    <p class="task"><span class="tag">${t.py ? "pandas" : "SQL"}</span>${esc(t.hint)}</p>
    <pre class="code blank-code">${hl(a, lang)}<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Пропущенное слово">${hl(b, lang)}</pre>
    <div class="row"><button type="button" class="primary" id="check">Проверить</button><button type="button" id="show">Подсказка</button></div>
    <div class="fb"></div>` + pager("blank", BLANK);
  const inp = $("#ans");
  inp.style.width = Math.max(8, t.a[0].length + 2) + "ch";
  const check = () => {
    const v = inp.value.trim().replace(/\(\)$/, "");
    const ok = t.a.some(x => x.toLowerCase() === v.toLowerCase());
    inp.className = ok ? "ok" : "bad";
    if (ok) { mark("blank", i); feedback(true, "Верно ✓", ""); } else feedback(false, "Пока нет", "Попробуйте ещё раз или откройте подсказку.");
  };
  $("#check").onclick = check;
  inp.onkeydown = e => { if (e.key === "Enter") check(); };
  $("#show").onclick = () => feedback(true, "Ответ: " + t.a[0], "");
  bindPager("blank", renderBlank);
  inp.focus({preventScroll: true});
}

/* ---------- 4–5. тесты ---------- */
function renderQuiz(sec, list, title, lead) {
  const i = pos[sec], t = list[i];
  const order = shuffle(t.opts.map((_, k) => k));
  const optLang = sec === "translate" ? (t.lang === "py" ? "sql" : "py") : "text";
  view.innerHTML = `<h2>${title}</h2><p class="lead">${lead}</p>
    <p class="task"><span class="tag">${t.lang === "py" ? "pandas" : "SQL"}</span>${sec === "translate" ? (t.lang === "py" ? "Как это записать на SQL?" : "Как это записать на pandas?") : "Что здесь не так?"}</p>
    <pre class="code">${hl(t.code, t.lang)}</pre>
    <div class="opts">${order.map(k => `<button type="button" class="opt" data-k="${k}">${optLang === "text" ? esc(t.opts[k]) : hl(t.opts[k], optLang)}</button>`).join("")}</div>
    <div class="fb"></div>` + pager(sec, list);
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    view.querySelectorAll(".opt").forEach(o => { if (+o.dataset.k === 0) o.classList.add("ok"); });
    if (k === 0) { mark(sec, i); feedback(true, "Верно ✓", t.why); }
    else { b.classList.add("bad"); feedback(false, "Не совсем", t.why); }
  });
  bindPager(sec, () => renderQuiz(sec, list, title, lead));
}

/* ---------- 6. песочница ---------- */
let db = null, dbError = "", sbSql = "SELECT * FROM orders LIMIT 5";
function loadDb() {
  if (typeof initSqlJs !== "function") { dbError = "Не удалось загрузить движок SQL (sql.js). Проверьте интернет и обновите страницу."; return Promise.resolve(); }
  return initSqlJs().then(SQL => {
    db = new SQL.Database();
    db.run("CREATE TABLE orders (order_id TEXT, date TEXT, customer_id TEXT, city TEXT, category TEXT, product TEXT, price INTEGER, qty INTEGER, status TEXT)");
    const lines = document.getElementById("csv").textContent.trim().split(/\r?\n/).slice(1);
    const st = db.prepare("INSERT INTO orders VALUES (?,?,?,?,?,?,?,?,?)");
    db.run("BEGIN");
    for (const l of lines) { const c = l.split(","); c[6] = +c[6]; c[7] = +c[7]; st.run(c); }
    db.run("COMMIT"); st.free();
  }).catch(e => { dbError = "Ошибка движка SQL: " + e.message; });
}
function runQuery(q) {
  const r = db.exec(q);
  return r.length ? r[r.length - 1] : {columns: [], values: []};
}
function tableHtml(res) {
  if (!res.columns.length) return `<div class="err" style="color:var(--muted)">Запрос выполнен, строк нет.</div>`;
  const rows = res.values.slice(0, 200);
  return `<table><thead><tr>${res.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => `<td class="${typeof v === "number" ? "n" : ""}">${v === null ? "NULL" : esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function renderSandbox() {
  const i = pos.sandbox, t = SANDBOX[i];
  view.innerHTML = `<h2>Песочница</h2>
    <p class="lead">Настоящий SQL прямо в браузере, на той же таблице <code>orders</code> из 500 заказов. Выберите задание, напишите запрос и нажмите «Проверить». Запустить запрос: Ctrl + Enter.</p>
    <div class="sb"><div>
      <p class="task"><span class="tag">${i + 1}/${SANDBOX.length}</span>${esc(t.t)}</p>
      <textarea id="q" spellcheck="false" aria-label="SQL-запрос">${esc(sbSql)}</textarea>
      <div class="row" style="margin-top:10px"><button type="button" class="primary" id="check">Проверить задание</button><button type="button" id="run">▶ Выполнить</button></div>
      <div class="fb"></div>
      <div class="res" id="res"></div><div class="meta" id="meta"></div>
    </div><div>
      <div class="schema"><strong style="color:var(--ink)">Таблица orders:</strong><br><code>order_id</code> <code>date</code> <code>customer_id</code> <code>city</code> <code>category</code> <code>product</code> <code>price</code> <code>qty</code> <code>status</code><br>
      status: <code>'оплачен'</code> / <code>'отменён'</code>; даты: <code>'2026-03-01'</code>…<code>'2026-10-31'</code></div>
      <div class="tasks">${SANDBOX.map((s, k) => `<button type="button" data-go="${k}" class="${k === i ? "on" : ""}${done.sandbox.includes(k) ? " ok" : ""}">${k + 1}. ${esc(s.t)}</button>`).join("")}</div>
    </div></div>`;
  const ta = $("#q"), res = $("#res"), meta = $("#meta");
  ta.oninput = () => { sbSql = ta.value; };
  const ready = () => {
    if (db) return true;
    res.innerHTML = `<div class="err">${esc(dbError || "Загружаю движок SQL…")}</div>`;
    return false;
  };
  const run = () => {
    if (!ready()) return null;
    try { const r = runQuery(ta.value); res.innerHTML = tableHtml(r); meta.textContent = `Строк: ${r.values.length}` + (r.values.length > 200 ? " (показаны первые 200)" : ""); return r; }
    catch (e) { res.innerHTML = `<div class="err">Ошибка: ${esc(e.message)}</div>`; meta.textContent = ""; return null; }
  };
  $("#run").onclick = run;
  ta.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } };
  $("#check").onclick = () => {
    const mine = run(); if (!mine) return;
    const ref = runQuery(t.q), ordered = /ORDER BY/i.test(t.q);
    const key = r => { const rows = r.values.map(v => JSON.stringify(v)); return (ordered ? rows : rows.sort()).join("\n"); };
    if (key(mine) === key(ref)) { mark("sandbox", i); feedback(true, "Верно! Результат совпал ✓", ""); renderSandboxTasks(); }
    else if (mine.columns.length !== ref.columns.length) feedback(false, `Нужно столбцов: ${ref.columns.length}, у вас: ${mine.columns.length}`, "Проверьте список после SELECT.");
    else if (mine.values.length !== ref.values.length) feedback(false, `Нужно строк: ${ref.values.length}, у вас: ${mine.values.length}`, "Проверьте условия WHERE и LIMIT.");
    else feedback(false, "Строк и столбцов столько, сколько нужно, но значения или порядок отличаются", "Проверьте порядок столбцов и ORDER BY.");
  };
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { pos.sandbox = +b.dataset.go; renderSandbox(); });
  if (db) run(); else ready();
}
function renderSandboxTasks() { view.querySelectorAll(".tasks [data-go]").forEach(b => b.classList.toggle("ok", done.sandbox.includes(+b.dataset.go))); }

/* ---------- навигация ---------- */
const RENDER = {
  cards: renderCards, build: renderBuild, blank: renderBlank, sandbox: renderSandbox,
  translate: () => renderQuiz("translate", TRANS, "Переводчик", "Дан код на одном языке — выберите такой же запрос на другом."),
  bugs: () => renderQuiz("bugs", BUGS, "Найди ошибку", "В каждом запросе есть одна типичная ошибка. Что не так?"),
};
function current() { const h = location.hash.slice(1); return RENDER[h] ? h : "cards"; }
function renderTabs() {
  const cur = current();
  document.getElementById("tabs").innerHTML = SECTIONS.map(s => {
    const n = done[s.id].length;
    return `<a href="#${s.id}" aria-current="${s.id === cur}" class="${n >= s.total ? "full" : ""}">${s.name} <small>${n}/${s.total}</small></a>`;
  }).join("");
  const on = document.querySelector('#tabs a[aria-current="true"]');
  if (on) on.parentNode.scrollLeft = on.offsetLeft - 16;
  const all = SECTIONS.reduce((a, s) => a + s.total, 0), got = SECTIONS.reduce((a, s) => a + done[s.id].length, 0);
  document.getElementById("total").textContent = `Выполнено: ${got} из ${all} заданий (${Math.round(got / all * 100)}%)`;
}
function route() { renderTabs(); RENDER[current()](); }
window.addEventListener("hashchange", route);
document.getElementById("reset").onclick = () => {
  SECTIONS.forEach(s => done[s.id] = []); save(); deck = null; buildState = null;
  Object.keys(pos).forEach(k => pos[k] = 0); route();
};
route();
loadDb().then(() => { if (current() === "sandbox") renderSandbox(); });
}
</script>
</body>
</html>
